name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Ubuntu Server
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y ejecutar script de despliegue
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            echo ">> Verificando /var/www/transturama.cl..."
            if [ ! -d "/var/www/transturama.cl" ]; then
              echo ">> Directorio no existe. Clonando repositorio en /var/www/transturama.cl..."
              sudo git clone https://github.com/respinozav/transturama.cl.git /var/www/transturama.cl
              sudo chown -R $(whoami):$(whoami) /var/www/transturama.cl
            fi
            cd /var/www/transturama.cl
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
